[project]
name = "fee-du-menage-crewai"
version = "0.1.0"
description = "CrewAI workspace for automated audits and maintenance workflows for the Fée du Ménage site."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai>=1.14.6,<2.0.0",
]

[project.scripts]
fee-du-menage-crew = "fee_du_menage_crew.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
